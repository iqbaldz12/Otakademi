# Production stack untuk otakademi.online: app + PostgreSQL + Caddy (HTTPS otomatis).
# Di server:
#   cp .env.production.example .env.production   (cek & sesuaikan nilainya)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Pastikan DNS A record otakademi.online -> IP server, dan port 80 & 443 terbuka.

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - otakademi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tidak expose port ke host; hanya dijangkau lewat jaringan internal.

  app:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      # Seed sekali di deploy pertama, lalu set RUN_SEED=false.
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - otakademi_uploads:/app/public/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  otakademi_pgdata:
  otakademi_uploads:
  caddy_data:
  caddy_config:
