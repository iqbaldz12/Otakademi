# Production stack untuk server yang sudah menjalankan Caddy DI DALAM DOCKER.
# App bergabung ke network Docker milik Caddy (eksternal, bernama "resource"),
# sehingga Caddy bisa mem-reverse_proxy ke app lewat NAMA CONTAINER — bukan
# 127.0.0.1 (yang di dalam container Caddy menunjuk ke dirinya sendiri).
#
# Di server:
#   cp .env.production.example .env.production   (cek & sesuaikan nilainya)
#   docker compose -f docker-compose.docker-caddy.yml --env-file .env.production up -d --build
#
# Lalu tambahkan blok reverse_proxy di Caddyfile host (lihat caddy-host.example.conf):
#   reverse_proxy otakademi-app:3000
#
# Catatan: DB tetap di jaringan internal default (tidak ikut network "resource"),
# jadi hanya app yang terjangkau Caddy.

services:
  db:
    image: postgres:16-alpine
    container_name: otakademi-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - otakademi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: .
    container_name: otakademi-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      # Seed sekali di deploy pertama, lalu set RUN_SEED=false.
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - otakademi_uploads:/app/public/uploads
    networks:
      - internal   # untuk bicara ke db
      - resource   # supaya container Caddy bisa menjangkau app
    # Tidak perlu expose/ports: Caddy menjangkau lewat network "resource".

networks:
  internal:
    # jaringan privat app <-> db
  resource:
    # network milik Caddy yang sudah ada; dibuat di luar compose ini.
    external: true

volumes:
  otakademi_pgdata:
  otakademi_uploads:
