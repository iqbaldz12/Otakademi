# ===========================================================================
# Blok reverse_proxy untuk Caddyfile server. Pilih SESUAI cara Caddy berjalan.
# ===========================================================================

# --- Kasus 1: Caddy jalan di dalam DOCKER (container "caddy") ---------------
# Pakai NAMA CONTAINER app, bukan 127.0.0.1. App & Caddy harus berada di
# network Docker yang sama (lihat docker-compose.docker-caddy.yml, network
# eksternal "resource"). File Caddyfile biasanya di-mount dari host, contoh:
#   /var/www/resource-data/caddy/config/Caddyfile
#
otakademi.online, www.otakademi.online {
	reverse_proxy otakademi-app:3000
	encode gzip zstd
}

# --- Kasus 2: Caddy jalan langsung di HOST (systemd, bukan Docker) ----------
# App di-bind ke 127.0.0.1:3000 (lihat docker-compose.host-caddy.yml).
# Aktifkan blok ini dan nonaktifkan Kasus 1 di atas.
#
# otakademi.online, www.otakademi.online {
# 	reverse_proxy 127.0.0.1:3000
# 	encode gzip zstd
# }
