# ===========================================================================
# Blok ini untuk Caddy yang SUDAH terpasang di server (host-level), bukan
# container. Tempelkan ke Caddyfile host kamu (biasanya /etc/caddy/Caddyfile),
# lalu reload: sudo systemctl reload caddy
#
# App berjalan di container dan di-bind ke 127.0.0.1:3000 (lihat
# docker-compose.host-caddy.yml). Caddy meneruskan trafik HTTPS publik ke sana
# dan mengurus sertifikat Let's Encrypt otomatis.
# ===========================================================================

otakademi.online, www.otakademi.online {
	reverse_proxy 127.0.0.1:3000
	encode gzip zstd
}
